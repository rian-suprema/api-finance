# ==============================================================================
# DECLARAÇÃO DE INFRAESTRUTURA — o que este serviço EXIGE para operar.
#
# Contrato serviço → SRE:
#   • NÓS declaramos (o archetype entrega este arquivo pré-preenchido);
#   • o SRE revisa/aprova em PR e REALIZA via pipeline de IaC (Terraform).
# Nada aqui provisiona coisa alguma — é declaração, não execução.
# O vocabulário de `type` aceito é do SRE (o catálogo de infra que eles suportam).
#
# Paridade local provada: o docker-compose.yml espelha 1:1 esta lista — a
# variante simples declara UM componente, e é só isso que ela usa (o gate
# anti-contrabando do architecture.spec.ts garante que continue assim).
# Ponto de junção com o deploy: os `outputs.env` entram em values-<env>.yaml;
# os `outputs.secret` chegam via Secret externo (padrão do SRE — ex.: ESO).
# ==============================================================================
service: api-finance
runtime:
  platform: kubernetes
  chart: deploy/helm/api-finance
  port: 3005
  probes:
    liveness: /health/liveness
    readiness: /health/readiness

requires:
  - type: postgres # → RDS Aurora PostgreSQL
    purpose: >-
      Persistência do domínio Finance (TypeORM; migrations em SQL explícito).
      As 8 tabelas do Finance NÃO usam Row-Level Security (marca ≠ tenant —
      isolamento por marca é só na aplicação via BrandAccessService; ver
      docs/migracao-finance/APRENDIZADOS-DECISOES-FINANCE.md, decisão 5).
      Separação de papéis por least-privilege (não por RLS):
      • ROLE de RUNTIME (a app): NÃO-owner, só DML — DB_USERNAME/DB_PASSWORD.
      • ROLE de MIGRAÇÃO/OWNER (Job PreSync): dono do schema, roda DDL —
        DB_MIGRATION_USERNAME/DB_MIGRATION_PASSWORD + DB_APP_ROLE (nome do
        runtime, p/ os grants). Os dois roles são criados pelo IaC/Terraform.
    outputs:
      env: [DB_HOST, DB_PORT, DB_USERNAME, DB_NAME, DB_APP_ROLE]
      # DOIS Secrets distintos: runtime (app) e migração/owner (Job PreSync)
      secret: [DB_PASSWORD, DB_MIGRATION_USERNAME, DB_MIGRATION_PASSWORD]

  # --- Consumo da auth SayPlus (Steps 1–3 da integração) ---------------------
  - type: k8s-secret
    purpose: >-
      Chave PÚBLICA (PEM) da SayPlus para validação passiva de JWT RS256.
      Entregue como Secret no namespace e montada pelo chart em
      /etc/sayplus/jwt/public.pem (values: jwtPublicKey.existingSecret).
      Trade-off registrado: por ser chave PÚBLICA (sem requisito de
      confidencialidade) e de rotação rara, provisionamento DIRETO do Secret
      (GitOps) é suficiente; plugar no trilho ASM(+KMS)+ESO é opcional — só
      se paga se for o trilho único que a operação já usa para os demais
      Secrets. Sem o Secret o app sobe fail-closed: probes ok, rotas 401.
    outputs:
      secret: [public.pem]

  - type: cni-network-policy
    purpose: >-
      PRÉ-REQUISITO de cluster: o CNI precisa IMPOR NetworkPolicy (EKS: VPC
      CNI com network policy habilitado, Calico ou Cilium) — sem imposição, a
      policy do chart fica silenciosamente inerte. O chart nasce com
      default-deny de ingress E de egress nos values de ambiente. Entrada:
      só a SayPlus API (namespace `sayplus`, pods app.kubernetes.io/name=sayplus-api).
      Saída da API: CoreDNS, Postgres (networkPolicy.egress.postgres.cidrs =
      subnets de dados [TERRAFORM OUTPUT]), HTTPS 443 para fora da VPC (Trio),
      SayPlus API na 3000 (GET /auth/me) e egress.extra (ClickHouse — [SRE]
      CIDR/porta do DW; se o endpoint for público em 443, a regra HTTPS cobre).
      Jobs (migrations): só DNS + Postgres. CronJobs (trio-capture,
      reconciliation): + HTTPS e egress.extra, por policy própria.
      EKS/VPC CNI: a porta do Service é igual à do container (3005).

  - type: k8s-namespace-label
    purpose: >-
      O namespace do módulo leva o label `sayplus.io/module: "true"` (o chart
      coloca o mesmo label nos pods). É o contrato com a NetworkPolicy da
      SayPlus: só pods com os dois labels trocam tráfego com ela (inclusive o
      GET /auth/me do finance). Aplicado pela plataforma no GitOps
      (Application do Argo CD), não pelo chart.

  - type: module-audience
    purpose: >-
      config.JWT_AUDIENCE = code do módulo no catálogo da SayPlus (`finance`).
      Obrigatório: sem ele o chart não renderiza (a SayPlus cunha
      aud=[sayplus, finance]; audience divergente = 401 em toda chamada).

  # --- Finance (Fase 17) — 3 dependências externas novas ---------------------
  # Ver docs/migracao-finance/INFRA-FINANCE.md §10 para o racional completo.
  - type: external-service # confirmar vocabulário com o SRE
    purpose: >-
      ClickHouse do data warehouse — leitura EXCLUSIVA de marts dw_bet.*
      (fct_kpi_daily, fct_sigap_saldo_diario, fct_deposit, fct_withdrawal,
      fct_correction). Credencial de leitura concedida pelo time de dados.
      O serviço DEGRADA (não falha) quando indisponível: por isso NÃO entra
      no readiness probe — ver INFRA-FINANCE.md §8.
      Egress necessário: HTTPS para o endpoint do cluster.
    outputs:
      env: [CLICKHOUSE_URL, CLICKHOUSE_USER, CLICKHOUSE_DATABASE]
      secret: [CLICKHOUSE_PASSWORD]

  - type: external-service
    purpose: >-
      API bancária da Trio (SaaS de terceiro) — leitura de saldo point-in-time
      e de extrato. Auth = HTTP Basic (client_id:client_secret).
      PICO DE TRÁFEGO ATÍPICO: a varredura de extrato por bisseção pode emitir
      até ~1.000 requisições HTTPS por marca em ~2 min (3 marcas em paralelo),
      uma vez ao dia. Confirmar com o SRE se NAT gateway/WAF tolera o padrão.
      Egress necessário: HTTPS 443 para o host da Trio.
    outputs:
      env:
        [
          TRIO_BASE_URL,
          TRIO_AMOUNT_DIVISOR,
          TRIO_ACCOUNT_ID_SUPREMA,
          TRIO_ACCOUNT_ID_ULTRA,
          TRIO_ACCOUNT_ID_MAXIMA,
        ]
      secret: [TRIO_CLIENT_ID, TRIO_CLIENT_SECRET]

  - type: internal-service
    purpose: >-
      API principal SayPlus — GET /auth/me resolve as MARCAS do vínculo do
      usuário (até 3 por request). É dependência CRÍTICA: sem ela nenhuma rota
      de negócio do Finance responde (503 "Não foi possível validar as marcas
      do usuário"). Cache de 60s em memória, por hash SHA-256 do token.
    outputs:
      env: [SAYPLUS_API_URL]
