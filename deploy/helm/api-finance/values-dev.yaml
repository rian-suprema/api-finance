# ==============================================================================
# Overrides do ambiente DEV — o PONTO DE JUNÇÃO entre a pipeline de IaC (SRE)
# e o chart. A ESTRUTURA é do archetype; os VALORES de ambiente vêm de fora:
#   [TERRAFORM OUTPUT] → preenchido com outputs do provisionamento (SRE)
#   [SRE]              → decisão/padrão do time de SRE
#   [CI]               → preenchido pela fase de publicação do CI
# Segredos NUNCA entram aqui: chegam via Secret externo (existingSecret).
# ==============================================================================
# 2 réplicas também em dev: com PDB minAvailable 1 e spread por zona, é o mínimo que
# sobrevive a drain de node e à perda de uma AZ (1 réplica + PDB travaria o drain).
replicaCount: 2

image:
  repository: '' # [SRE] registry a definir (agnóstico) — ex.: <registry>/api-finance
  tag: '' # [CI] SHA do commit na publicação — nunca "latest"

config:
  # SayPlus API (GET /auth/me) pelo DNS interno — nunca pelo hostname público.
  SAYPLUS_API_URL: '' # [SRE] ex.: http://sayplus-api.sayplus.svc.cluster.local:3000
  # ClickHouse do DW (credencial de leitura em CLICKHOUSE_PASSWORD, no existingSecret)
  CLICKHOUSE_URL: '' # [SRE]
  CLICKHOUSE_USER: '' # [SRE]
  CLICKHOUSE_DATABASE: dw_bet
  # API bancária da Trio (TRIO_CLIENT_ID/TRIO_CLIENT_SECRET no existingSecret)
  TRIO_BASE_URL: '' # [SRE]
  # 1 (reais) ou 100 (centavos): NUNCA adivinhar — confirmar na doc da Trio (PARADA HUMANA).
  TRIO_AMOUNT_DIVISOR: '' # [TIME FINANCE]
  TRIO_ACCOUNT_ID_SUPREMA: '' # [SRE]
  TRIO_ACCOUNT_ID_ULTRA: '' # [SRE]
  TRIO_ACCOUNT_ID_MAXIMA: '' # [SRE]
  DB_HOST: '' # [TERRAFORM OUTPUT] endpoint do Aurora (writer)
  DB_USERNAME: '' # [TERRAFORM OUTPUT]
  DB_NAME: '' # [TERRAFORM OUTPUT]
  # Observabilidade (OpenTelemetry) — o app só fala OTLP; Collector, sampling,
  # dashboards, retenção e alertas são do SRE. Vazio = telemetria DESLIGADA
  # (interruptor fail-safe do esqueleto).
  OTEL_EXPORTER_OTLP_ENDPOINT: '' # [SRE] ex.: http://otel-collector.observability:4318
  OTEL_SERVICE_NAME: api-finance
  OTEL_TRACES_SAMPLER: parentbased_traceidratio # [SRE] política de sampling
  OTEL_TRACES_SAMPLER_ARG: '0.1' # [SRE] fração amostrada

# Secret provisionado FORA do chart (padrão do SRE — ex.: External Secrets →
# Secrets Manager). Deve conter: DB_PASSWORD.
existingSecret: '' # [SRE] nome do Secret no namespace

# Consumo da auth SayPlus (Step 3 da integração)
jwtPublicKey:
  # [SRE] Secret do namespace com a chave pública (PEM) da SayPlus — ver
  # deploy/infra/requirements.yaml (provisionamento direto/GitOps é suficiente;
  # trilho ASM+ESO é opcional). Vazio = app fail-closed (rotas protegidas 401).
  existingSecret: ''

# Postura zero-trust do archetype: a policy NASCE habilitada no ambiente.
# ⚠️ Preencher gatewayNamespace ANTES do 1º deploy — vazio = deny-all total
# (nem o gateway alcança o pod). Pré-requisito: CNI que imponha NetworkPolicy.
networkPolicy:
  enabled: true
  egress:
    postgres:
      cidrs: [] # [TERRAFORM OUTPUT] CIDRs das subnets de dados (Aurora)
