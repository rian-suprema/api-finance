{{- if .Values.networkPolicy.enabled }}
# Leste/Oeste fail-closed: com a policy habilitada, NENHUM pod alcança este
# serviço a não ser o que o allow abaixo declarar. Sem gatewayNamespace
# preenchido, o efeito é deny-all — intencional: a abertura é decisão
# explícita do SRE, nunca um default do chart.
# Nota: probes (kubelet → pod) chegam do nó e, nos CNIs usuais, não são
# afetadas por policy de podSelector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "api-finance.fullname" . }}
  labels:
    {{- include "api-finance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api-finance.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.ingress.gatewayNamespace }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.gatewayNamespace }}
          {{- with .Values.networkPolicy.ingress.gatewayPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- end }}
{{- end }}
