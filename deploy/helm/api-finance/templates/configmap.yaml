# Config NÃO-sensível da aplicação (envFrom no Deployment).
# Sensível vem de Secret externo (values.existingSecret) — nunca daqui.
# JWT_AUDIENCE obrigatório: é o `code` do módulo no catálogo da SayPlus. Errado ou
# ausente, a SayPlus e o módulo discordam do `aud` e toda chamada vira 401.
{{- $_ := required "config.JWT_AUDIENCE é obrigatório: use o code do módulo no catálogo da SayPlus (a SayPlus cunha aud=[sayplus, <code>])" .Values.config.JWT_AUDIENCE }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-finance.fullname" . }}
  labels:
    {{- include "api-finance.labels" . | nindent 4 }}
  annotations:
    # O Job de migrations (hook pre-install/pre-upgrade) consome este ConfigMap
    # via envFrom. Sem hook aqui, na PRIMEIRA instalação o ConfigMap só nasceria
    # no sync principal — que nunca começa porque espera o hook completar
    # (deadlock: pod em CreateContainerConfigError). hook-weight -5 garante que
    # ele exista ANTES do Job (weight 0) dentro da mesma fase.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
