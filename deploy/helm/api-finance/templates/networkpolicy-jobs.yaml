{{- if .Values.networkPolicy.enabled }}
# Pods dos Jobs (migrations PreSync, seed PostSync): nenhuma entrada; saída só CoreDNS e
# Postgres. Eles não são selecionados pela NetworkPolicy do Deployment (labels próprios).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "api-finance.fullname" . }}-jobs
  labels:
    {{- include "api-finance.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api-finance.jobSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egress.postgres }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
{{- end }}
