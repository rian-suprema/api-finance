# ==============================================================================
# Values do archetype (variante simples) — defaults seguros; ambientes
# sobrescrevem por arquivo (values-dev.yaml, values-prod.yaml) quando o
# provisionamento existir.
# ==============================================================================

replicaCount: 2

image:
  # Decisão adiada de propósito: o registry definido pela organização entra AQUI —
  # trocar de registry é trocar este value, não retrabalhar o chart.
  repository: api-finance
  # Na fase de publicação: SHA do commit (imutável). NUNCA "latest".
  tag: ci
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # Porta do Service IGUAL à do container: a NetworkPolicy do VPC CNI (EKS) só é
  # aplicada corretamente assim. A SayPlus chama http://<svc>.<ns>.svc.cluster.local:3005.
  port: 3005
  targetPort: 3005

# Identidade de módulo SayPlus: o label `sayplus.io/module: "true"` vai nos pods (o
# namespace recebe o mesmo label pelo GitOps da plataforma). A NetworkPolicy da SayPlus
# só troca tráfego com pods que tenham os dois.
sayplusModule: true

# Disponibilidade durante drain/upgrade de node: com 2+ réplicas, ao menos 1 fica de pé.
pdb:
  enabled: true
  minAvailable: 1

# Réplicas em zonas (e nodes) diferentes: a perda de uma AZ não derruba o módulo.
topologySpread:
  enabled: true
  whenUnsatisfiable: ScheduleAnyway

# Sem requests/limits não há scheduling decente nem HPA — obrigatório.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

terminationGracePeriodSeconds: 30

probes:
  liveness:
    path: /health/liveness
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /health/readiness
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# Config NÃO-sensível — vira ConfigMap (envFrom). Sensível (DB_PASSWORD etc.)
# NUNCA entra aqui: vem de Secret referenciado em existingSecret, provisionado
# fora do chart (External Secrets → AWS Secrets Manager, na fase de infra).
config:
  NODE_ENV: production
  PORT: '3005'
  API_PREFIX: api/v1
  # Auth SayPlus (JWT RS256 — validação passiva; o módulo nunca emite).
  # Issuer/audience são INVARIANTES entre ambientes (contrato da plataforma).
  # A chave pública será montada via Secret+volume neste caminho (Step 3 da
  # integração); sem ela o app sobe fail-closed: probes ok, rotas 401.
  JWT_ISSUER: sayplus
  # Code do módulo no catálogo da SayPlus (a SayPlus cunha aud=[sayplus, finance]).
  # Vinha `petshop` (sobra do archetype): toda chamada seria recusada com 401.
  JWT_AUDIENCE: finance
  JWT_PUBLIC_KEY_PATH: /etc/sayplus/jwt/public.pem
  DB_PORT: '5432'
  DB_SSL: 'true'
  # Endpoints/hosts por ambiente (Aurora) entram nos values do ambiente na
  # fase de provisionamento: DB_HOST / DB_USERNAME / DB_NAME

# Nome de um Secret já existente no namespace com as variáveis sensíveis
# (DB_PASSWORD, ...). Vazio = nenhum secret referenciado (ex.: helm template).
existingSecret: ''

# Chave pública da SayPlus (JWT RS256) — montada como o arquivo apontado por
# config.JWT_PUBLIC_KEY_PATH. O Secret vive FORA do chart (ver
# deploy/infra/requirements.yaml). Trade-off registrado: provisionamento
# direto/GitOps do Secret é SUFICIENTE (chave pública — sem requisito de
# confidencialidade — e rotação rara); plugar no trilho ASM+ESO é opcional,
# válido só se for o trilho único que o SRE já opera. Vazio = sem montagem —
# o app sobe fail-closed (probes ok, rotas protegidas 401).
# Migrations como Job PreSync, com o role de MIGRAÇÃO/OWNER (Step 5 — RLS).
# A app (Deployment) conecta como runtime não-owner (existingSecret), sem DDL.
migrations:
  enabled: true
  backoffLimit: 2
  # [SRE] Secret com DB_MIGRATION_USERNAME/PASSWORD (owner) e DB_APP_ROLE.
  # Distinto de existingSecret (runtime). Vazio = Job usa só o ConfigMap.
  existingSecret: ''

jwtPublicKey:
  existingSecret: ''
  # Nome do item (data key) dentro do Secret que contém o PEM
  secretKey: public.pem

# CronJobs do módulo Finance — substituem os `@Cron` in-process que a origem
# tinha, eliminando a duplicação de trabalho contra a Trio que `replicaCount: 2`
# causaria (ver docs/migracao-finance/INFRA-FINANCE.md §6 e CLAUDE.md item 3).
# `schedule` em UTC, fixo (o CronJob do K8s não garante `timeZone` em todo
# cluster) — sobrescrever por ambiente em values-<env>.yaml se o horário BRT
# precisar mudar (ex.: retorno do horário de verão).
cronjobs:
  trioCapture:
    enabled: true
    # 00:03 BRT = 03:03 UTC (aproxima os 00:00:30 BRT do @Cron original).
    schedule: '3 3 * * *'
    backoffLimit: 2
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
  reconciliation:
    enabled: true
    # 04:00 BRT = 07:00 UTC.
    schedule: '0 7 * * *'
    backoffLimit: 2
    terminationGracePeriodSeconds: 30
    # Perfil diferente do Deployment: a varredura carrega em memória os
    # lançamentos das 2 pontas das 3 marcas em paralelo — não medido ainda,
    # chute mais seguro que o default do CRUD até medir uma execução real
    # (ver INFRA-FINANCE.md §9.2).
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 500m, memory: 1Gi }

# Tráfego Leste/Oeste: default-deny de ingress E de egress + allow explícito.
# NASCE HABILITADA nos ambientes (values-{dev,prod}).
# PRÉ-REQUISITO (ver requirements.yaml): o CNI do cluster precisa IMPOR
# NetworkPolicy (EKS: VPC CNI c/ network policy habilitado, Calico ou Cilium).
networkPolicy:
  enabled: false
  ingress:
    # Quem chama o módulo é a SayPlus API (proxy + token exchange).
    gatewayNamespace: sayplus
    gatewayPodLabels:
      app.kubernetes.io/name: sayplus-api
  egress:
    enabled: true
    dns: true
    postgres:
      port: 5432
      cidrs: [] # [TERRAFORM OUTPUT] CIDRs das subnets de dados (Aurora)
    redis:
      port: 6379
      cidrs: []
    # API bancária da Trio (terceiro, HTTPS 443). Nunca faixas privadas.
    https:
      enabled: true
    podIdentity:
      enabled: false
    # GET /auth/me da SayPlus (resolve as marcas do usuário) — dependência crítica.
    sayplusApi:
      enabled: true
      port: 3000
    # ClickHouse do data warehouse: [SRE] CIDR/porta do DW (ex.: 8443 HTTPS). Até lá,
    # o finance DEGRADA as telas que dependem dele (não entra no readiness).
    extra: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
