# ==============================================================================
# CI do archetype (variante simples) — fase que antecede o provisionamento:
# valida, empacota e confere os artefatos de entrega SEM publicar nada.
#
#   quality-validation + security  → required status checks do golden path
#   e2e-testing                    → app real contra infra efêmera (Testcontainers)
#   build-image                    → a IMAGEM é construível, escaneada e sobe
#                                    (sem push — o artefato morre com o runner)
#   helm-validate                  → o CHART renderiza e passa no schema do K8s
#                                    (sem install/push — nenhum kubeconfig no CI)
#
# Publicação (registry a definir — armazenamento agnóstico) e deploy (ArgoCD/SRE)
# pertencem a outra fase: build-image e helm-validate são os pontos de plug
# quando o destino for definido, sem retrabalho.
#
# Nota de hardening: actions pinadas por tag de major (@vN). Se a política da
# org exigir, endureça para SHA completo — mesmo racional do "nunca latest".
# ==============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Disparo manual (aba Actions → Run workflow) — reexecuta a esteira sob demanda,
  # sem precisar de novo push/PR.
  workflow_dispatch:

jobs:
  quality-validation:
    name: quality-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci: instala EXATAMENTE o package-lock.json (defesa supply chain);
      # --ignore-scripts bloqueia pós-install de terceiros no runner.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Densidade de duplicação (jscpd): gate em 3% — ver README §Quality gate
      - run: npm run dup:check
      - run: npm run format:check
      - run: npm run test:cov
      - run: npm run build

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Gate 1 — inventário de scripts de install confere com a allowlist versionada.
      # A allowlist NÃO autoriza execução (nada roda com --ignore-scripts): é lista
      # de REVISÃO. Reprova nos dois sentidos: pacote novo fora da lista (+), entrada
      # órfã na lista (-). Regenerar SEMPRE na plataforma do runner (glibc/x64) —
      # instrução no cabeçalho de .github/install-scripts-allowlist.txt.
      - name: Gate — scripts de install conferem com a allowlist
        run: |
          npm query ':attr(scripts,[install]),:attr(scripts,[preinstall]),:attr(scripts,[postinstall])' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=new Set(JSON.parse(d).map(p=>p.name));console.log([...s].sort().join("\n"))})' \
            | LC_ALL=C sort > /tmp/atual.txt
          grep -vE '^[[:space:]]*(#|$)' .github/install-scripts-allowlist.txt | LC_ALL=C sort > /tmp/esperado.txt
          if ! diff -u /tmp/esperado.txt /tmp/atual.txt; then
            echo "::error::A arvore instalada divergiu de .github/install-scripts-allowlist.txt."
            echo "Linhas '-' = na allowlist e ausentes na arvore (remova a entrada)."
            echo "Linhas '+' = na arvore e fora da allowlist — REVISE O SCRIPT antes de somar a entrada."
            echo "Regenerar (na plataforma do runner): ver o cabecalho do arquivo."
            exit 1
          fi
          echo "OK — $(wc -l < /tmp/atual.txt) pacotes com script de install, todos previstos e todos bloqueados."
      # Gate 2 — assinatura/proveniência do registry: prova que cada tarball é o que
      # o registry ASSINOU (detecta adulteração em registry/mirror). NÃO atesta que o
      # pacote seja confiável — um malicioso publicado legitimamente passa.
      - name: Gate — assinaturas e proveniência do registry
        run: npm audit signatures


  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # SCA: falha o gate em HIGH/CRITICAL; moderates exigem registro no README.
      # Este job é o SLOT para ferramentas dedicadas (socket.dev, Snyk, Sonar) —
      # exigem credencial de org, ver README §Plataforma.
      - run: npm audit --audit-level=high

  e2e-testing:
    name: e2e-testing
    runs-on: ubuntu-latest # Docker disponível — requisito do Testcontainers
    needs: [quality-validation]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Stubs das 3 dependências externas (:3100 SayPlus /auth/me, :9001 Trio,
      # :8123 ClickHouse) — as suítes e2e exigem os três de pé.
      - name: Sobe os stubs de dev
        run: |
          node scripts/finance-dev-stubs.js > stubs.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:3100/auth/me && exit 0
            sleep 1
          done
          cat stubs.log; echo "::error::stubs não subiram"; exit 1
      - run: npm run test:e2e

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: [quality-validation, security] # só empacota código validado
    permissions:
      contents: read
      security-events: write # upload SARIF para a aba Security
    steps:
      - uses: actions/checkout@v5

      - name: Build da imagem (sem push — artefato morre com o runner)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true # disponibiliza no daemon local p/ scan e smoke
          tags: api-finance:ci

      # ── Scan da imagem em 3 camadas — runbook de triagem no README §Segurança ──
      # O scan cobre a IMAGEM inteira (SO base + camadas + app/node_modules):
      # complementa o npm audit, que cobre só o lockfile do app.

      # 1) VISIBILIDADE: o relatório completo aparece na página do run
      #    (Job Summary) — ninguém precisa escavar log para ver o que gritou.
      - name: Scan — relatório para o Job Summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          format: table
          output: trivy-report.txt
          exit-code: '0' # esta camada só reporta; quem bloqueia é o gate
      - name: Publica o relatório no Job Summary
        if: always()
        run: |
          {
            echo '## 🔍 Trivy — scan da imagem api-finance:ci'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2) GRITO INSTITUCIONAL: cada CVE vira alerta rastreável na aba Security
      #    (histórico, atribuição, dismissal auditável) — o canal do time de
      #    segurança. ESTE REPOSITÓRIO É PRIVADO: a aba Security exige GitHub
      #    Advanced Security. O canal é OPT-IN pela variável de repositório
      #    TRIVY_SARIF_UPLOAD=true (Settings → Secrets and variables → Actions
      #    → Variables) — ligue-a QUANDO o GHAS estiver habilitado. Sem a
      #    variável os steps ficam "skipped" (limpo), em vez de falhar sempre
      #    e ensinar o time a ignorar avisos. O gate abaixo bloqueia sempre,
      #    com ou sem este canal.
      - name: Scan — SARIF
        if: vars.TRIVY_SARIF_UPLOAD == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload SARIF para a aba Security
        if: vars.TRIVY_SARIF_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # 3) GATE: HIGH/CRITICAL derruba o job. Exceção SÓ via .trivyignore —
      #    aceite de risco formal com dono, justificativa, expiração e aprovação
      #    do time de segurança (o contrato está no cabeçalho do arquivo).
      - name: Scan — gate HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Smoke — a imagem sobe contra dependências reais
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile full up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3005/health/readiness; then exit 0; fi
            sleep 2
          done
          echo '--- readiness nunca respondeu; logs da api: ---'
          docker compose --profile full logs api
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full down -v

  helm-validate:
    name: helm-validate
    runs-on: ubuntu-latest # independente: valida o chart, não a aplicação
    steps:
      - uses: actions/checkout@v5
      # CIDR fictício exercita a regra de saída para o Postgres, que só renderiza com
      # cidrs preenchidos. JWT_AUDIENCE do finance já vem no chart (`finance`).
      - name: Lint do chart
        run: helm lint deploy/helm/api-finance
      # Matriz: default + os values de ambiente. Só com values-{dev,prod} as
      # NetworkPolicies são renderizadas — sem a matriz nunca passariam pelo gate.
      - name: Renderiza os manifests (default, dev, prod)
        run: |
          set -euo pipefail
          C=deploy/helm/api-finance
          PG=(--set 'networkPolicy.egress.postgres.cidrs={10.0.0.0/24}')
          helm template api-finance "$C" "${PG[@]}" > rendered-default.yaml
          helm template api-finance "$C" -f "$C/values-dev.yaml" "${PG[@]}" > rendered-dev.yaml
          helm template api-finance "$C" -f "$C/values-prod.yaml" "${PG[@]}" > rendered-prod.yaml
          # Blocos opcionais ligados (redis, podIdentity, extra = ClickHouse fictício).
          helm template api-finance "$C" -f "$C/values-dev.yaml" "${PG[@]}" \
            --set 'networkPolicy.egress.redis.cidrs={10.0.1.0/24}' \
            --set networkPolicy.egress.podIdentity.enabled=true \
            --set 'networkPolicy.egress.extra[0].to[0].ipBlock.cidr=10.20.0.0/24' \
            --set 'networkPolicy.egress.extra[0].ports[0].port=8443' > rendered-egress-full.yaml
          for f in rendered-dev.yaml rendered-prod.yaml; do
            # app + jobs (migrations) + cronjobs (Trio/ClickHouse)
            [ "$(grep -c '^kind: NetworkPolicy' "$f")" = 3 ] || { echo "::error::$f sem as 3 NetworkPolicies"; exit 1; }
            grep -q '^kind: PodDisruptionBudget' "$f" || { echo "::error::$f sem PodDisruptionBudget"; exit 1; }
            grep -q 'JWT_AUDIENCE: "finance"' "$f" || { echo "::error::$f com JWT_AUDIENCE diferente de finance"; exit 1; }
            [ "$(grep -c 'app.kubernetes.io/component: cronjob' "$f")" -ge 3 ] || { echo "::error::$f: CronJobs fora da policy de saída deles"; exit 1; }
          done
      # Fail-closed provado: sem o audience do módulo o chart NÃO pode renderizar.
      - name: Sem JWT_AUDIENCE o chart é recusado
        run: |
          if helm template api-finance deploy/helm/api-finance --set config.JWT_AUDIENCE= >/dev/null 2>&1; then
            echo "::error::o chart renderizou sem config.JWT_AUDIENCE"; exit 1
          fi
      - name: Valida manifests contra o schema do K8s
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -summary rendered-default.yaml rendered-dev.yaml rendered-prod.yaml rendered-egress-full.yaml
