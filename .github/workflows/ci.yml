# ==============================================================================
# CI do archetype (variante simples) — fase que antecede o provisionamento:
# valida, empacota e confere os artefatos de entrega SEM publicar nada.
#
#   quality-validation + security  → required status checks do golden path
#   e2e-testing                    → app real contra infra efêmera (Testcontainers)
#   build-image                    → a IMAGEM é construível, escaneada e sobe
#                                    (sem push — o artefato morre com o runner)
#   helm-validate                  → o CHART renderiza e passa no schema do K8s
#                                    (sem install/push — nenhum kubeconfig no CI)
#
# Publicação (registry a definir — armazenamento agnóstico) e deploy (ArgoCD/SRE)
# pertencem a outra fase: build-image e helm-validate são os pontos de plug
# quando o destino for definido, sem retrabalho.
#
# Nota de hardening: actions pinadas por tag de major (@vN). Se a política da
# org exigir, endureça para SHA completo — mesmo racional do "nunca latest".
# ==============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Disparo manual (aba Actions → Run workflow) — reexecuta a esteira sob demanda,
  # sem precisar de novo push/PR.
  workflow_dispatch:

jobs:
  quality-validation:
    name: quality-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci: instala EXATAMENTE o package-lock.json (defesa supply chain);
      # --ignore-scripts bloqueia pós-install de terceiros no runner.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # Densidade de duplicação (jscpd): gate em 3% — ver README §Quality gate
      - run: npm run dup:check
      - run: npm run format:check
      - run: npm run test:cov
      - run: npm run build

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Gate 1 — inventário de scripts de install confere com a allowlist versionada.
      # A allowlist NÃO autoriza execução (nada roda com --ignore-scripts): é lista
      # de REVISÃO. Reprova nos dois sentidos: pacote novo fora da lista (+), entrada
      # órfã na lista (-). Regenerar SEMPRE na plataforma do runner (glibc/x64) —
      # instrução no cabeçalho de .github/install-scripts-allowlist.txt.
      - name: Gate — scripts de install conferem com a allowlist
        run: |
          npm query ':attr(scripts,[install]),:attr(scripts,[preinstall]),:attr(scripts,[postinstall])' \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const s=new Set(JSON.parse(d).map(p=>p.name));console.log([...s].sort().join("\n"))})' \
            | LC_ALL=C sort > /tmp/atual.txt
          grep -vE '^[[:space:]]*(#|$)' .github/install-scripts-allowlist.txt | LC_ALL=C sort > /tmp/esperado.txt
          if ! diff -u /tmp/esperado.txt /tmp/atual.txt; then
            echo "::error::A arvore instalada divergiu de .github/install-scripts-allowlist.txt."
            echo "Linhas '-' = na allowlist e ausentes na arvore (remova a entrada)."
            echo "Linhas '+' = na arvore e fora da allowlist — REVISE O SCRIPT antes de somar a entrada."
            echo "Regenerar (na plataforma do runner): ver o cabecalho do arquivo."
            exit 1
          fi
          echo "OK — $(wc -l < /tmp/atual.txt) pacotes com script de install, todos previstos e todos bloqueados."
      # Gate 2 — assinatura/proveniência do registry: prova que cada tarball é o que
      # o registry ASSINOU (detecta adulteração em registry/mirror). NÃO atesta que o
      # pacote seja confiável — um malicioso publicado legitimamente passa.
      - name: Gate — assinaturas e proveniência do registry
        run: npm audit signatures


  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # SCA: falha o gate em HIGH/CRITICAL; moderates exigem registro no README.
      # Este job é o SLOT para ferramentas dedicadas (socket.dev, Snyk, Sonar) —
      # exigem credencial de org, ver README §Plataforma.
      - run: npm audit --audit-level=high

  e2e-testing:
    name: e2e-testing
    runs-on: ubuntu-latest # Docker disponível — requisito do Testcontainers
    needs: [quality-validation]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Stubs das 3 dependências externas (:3100 SayPlus /auth/me, :9001 Trio,
      # :8123 ClickHouse) — as suítes e2e exigem os três de pé.
      - name: Sobe os stubs de dev
        run: |
          node scripts/finance-dev-stubs.js > stubs.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:3100/auth/me && exit 0
            sleep 1
          done
          cat stubs.log; echo "::error::stubs não subiram"; exit 1
      # Roda com --coverage, como no archetype: o `test:cov` do quality-validation só
      # executa `*.spec.ts` sob `rootDir: src`; controller e repositório só são
      # exercitados aqui.
      - run: npm run test:e2e:cov

  # ============================================================================
  # commit-messages — o ÚNICO gate em que `--no-verify` era definitivo.
  #
  # O hook `commit-msg` roda commitlint na máquina do dev, e nada reconferia
  # depois: quem passa `--no-verify` (ou clona sem rodar `npm install`, que é
  # quando o hook nem existe) grava mensagem fora do Conventional Commits e o
  # CI nunca reclamava. Este job confere o RANGE empurrado, commit por commit.
  #
  # `fetch-depth: 0` é obrigatório: sem o histórico, o range não resolve.
  #
  # TRÊS DECISÕES ANTI-VACUIDADE, e as três nasceram de buraco medido:
  #
  #   1. UM passo só, que descobre o range sozinho. A primeira versão tinha um
  #      passo `if: pull_request` e outro `if: push` — e em `workflow_dispatch`
  #      NENHUM dos dois rodava: o job ficava VERDE sem conferir mensagem
  #      nenhuma. Gate que passa sem executar é pior que gate ausente, porque
  #      alguém conta com ele;
  #   2. RANGE VAZIO É FALHA, não sucesso. É a mesma régua do `deploy-path`,
  #      que recusa zero migrations compiladas;
  #   3. a exceção do Dependabot é por AUTOR do commit, não por texto da
  #      mensagem. Ele gera assunto em sentence-case (`Bump jscpd in the ...`),
  #      que a regra `subject-case` proíbe, e isso reprovava TODO PR dele
  #      (medido em 11/09/2026). A primeira correção usava `ignores` no
  #      `commitlint.config.mjs` casando o TEXTO — e qualquer pessoa que
  #      escrevesse `chore(deps): Bump ...` herdava a isenção. Por autor, a
  #      isenção alcança só quem ela deveria alcançar.
  #
  # Merge commit é pulado por FORMA (dois pais): a mensagem dele é gerada pelo
  # GitHub e não está sob controle de quem abre o PR.
  #
  # Nenhuma das duas isenções é barreira de SEGURANÇA — autor de commit se
  # forja localmente. Elas evitam falso positivo; o que impede mensagem ruim de
  # propósito é revisão, não este job.
  # ============================================================================
  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: commitlint sobre o range, commit por commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_ANTES: ${{ github.event.before }}
          PUSH_ATE: ${{ github.sha }}
        run: |
          set -eu
          ZEROS=0000000000000000000000000000000000000000

          if [ -n "${PR_BASE:-}" ] && [ -n "${PR_HEAD:-}" ]; then
            DE="$PR_BASE"; ATE="$PR_HEAD"; ORIGEM='pull_request'
          elif [ -n "${PUSH_ANTES:-}" ] && [ "$PUSH_ANTES" != "$ZEROS" ]; then
            DE="$PUSH_ANTES"; ATE="$PUSH_ATE"; ORIGEM='push'
          else
            # workflow_dispatch, branch nova ou force-push: não há range gravado
            # no evento, e o que dá para conferir é o commit do topo.
            DE='HEAD~1'; ATE='HEAD'; ORIGEM='sem range no evento'
          fi
          echo "origem: $ORIGEM | range: $DE..$ATE"

          COMMITS=$(git rev-list "$DE..$ATE")
          if [ -z "$COMMITS" ]; then
            echo '::error::range vazio — este gate não conferiu mensagem nenhuma'
            exit 1
          fi

          CONFERIDOS=0
          FALHOU=0
          for SHA in $COMMITS; do
            if [ "$(git log -1 --format=%P "$SHA" | wc -w)" -gt 1 ]; then
              echo "-- $SHA: merge commit (mensagem gerada pelo GitHub), pulado"
              continue
            fi
            AUTOR=$(git log -1 --format=%ae "$SHA")
            case "$AUTOR" in
              *dependabot*)
                echo "-- $SHA: autor $AUTOR, pulado por autoria"
                continue
                ;;
            esac
            echo "-- $SHA ($AUTOR)"
            CONFERIDOS=$((CONFERIDOS + 1))
            if ! git log -1 --format=%B "$SHA" | npx --no -- commitlint --verbose; then
              FALHOU=1
            fi
          done

          echo "mensagens conferidas: $CONFERIDOS"
          exit "$FALHOU"
  # ============================================================================
  # deploy-path — o Job de migração do cluster, exercitado como ele roda de fato.
  #
  # POR QUE ELE EXISTE, e o que nenhum outro job cobre. O `e2e-testing` prova o
  # SQL das migrations: as suítes importam as classes e as aplicam num Postgres
  # de Testcontainers. Isso não passa por NADA da cadeia de deploy — não lê
  # `.env` pelo dotenv, não usa `src/database/data-source.ts`, não chama
  # `runMigrations()` e não executa o compilado em `dist/`.
  #
  # O chart invoca `node dist/database/migration-runner.js` num Job de pré-sync,
  # e aquele arquivo é o único consumidor de `dotenv` no repositório. Sem este
  # job, uma quebra ali só apareceria no cluster.
  #
  # O DEFEITO QUE ELE GUARDA está escrito no `data-source.ts`: o glob das
  # migrations aceita `{.ts,.js}` porque a CLI roda sobre `src/` e o Job roda o
  # compilado. Glob fixo em `src/*.ts` encontra ZERO migrations no contêiner e o
  # Job "passa" sem migrar nada — foi capturado na POC de CI/CD. É por isso que
  # a asserção compara APLICADAS com ARQUIVOS COMPILADOS, em vez de fixar um
  # número: número fixo envelhece a cada migration nova, e o que importa provar
  # é que o runner achou todas.
  # ============================================================================
  deploy-path:
    name: deploy-path
    runs-on: ubuntu-latest
    needs: [quality-validation]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_deploy
          POSTGRES_DB: finance_deploy
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # O runner lê `.env` pelo dotenv, e o `data-source` cai nas vars de
      # runtime quando as de migração não existem — o fluxo de usuário único.
      - name: .env como o Job de deploy o recebe
        run: |
          {
            echo NODE_ENV=production
            echo DB_HOST=localhost
            echo DB_PORT=5432
            echo DB_USERNAME=postgres
            echo DB_PASSWORD=ci_deploy
            echo DB_NAME=finance_deploy
            echo DB_SSL=false
          } > .env
      # Falha aqui já é o gate: o runner sai diferente de zero se a conferência
      # de cobertura de RLS reprovar, e é a MESMA função que o gate de schema usa.
      # Role de runtime como no Aurora (IaC-AWS ADR-008): a migration GrantRuntimeRole
      # concede DML a ele. Sem os grants, a app tomaria `permission denied` no cluster.
      - name: role de runtime (finance_app)
        env:
          PGPASSWORD: ci_deploy
        run: psql -h localhost -U postgres -d finance_deploy -c "CREATE ROLE finance_app LOGIN PASSWORD 'ci_app'"
      - name: migration-runner compilado
        run: DB_APP_ROLE=finance_app node dist/database/migration-runner.js
      - name: aplicadas == arquivos compilados
        env:
          PGPASSWORD: ci_deploy
        run: |
          arquivos=$(ls dist/database/migrations/*.js | wc -l)
          aplicadas=$(psql -h localhost -U postgres -d finance_deploy -At \
            -c "SELECT count(*) FROM migrations")
          echo "arquivos compilados: $arquivos | aplicadas: $aplicadas"
          test "$arquivos" -gt 0 || { echo "ZERO migrations compiladas — o build não as emitiu"; exit 1; }
          test "$aplicadas" = "$arquivos" || { echo "o runner não aplicou todas"; exit 1; }
      # Idempotência: o Job de pré-sync pode reexecutar. A segunda passada tem de
      # aplicar ZERO e continuar saindo com sucesso.
      - name: runtime tem DML e não tem DDL
        env:
          PGPASSWORD: ci_app
        run: |
          set -eu
          Q() { psql -h localhost -U finance_app -d finance_deploy -v ON_ERROR_STOP=1 -At -c "$1"; }
          for tabela in $(PGPASSWORD=ci_deploy psql -h localhost -U postgres -d finance_deploy -At \
              -c "SELECT tablename FROM pg_tables WHERE schemaname='public' AND tablename <> 'migrations'"); do
            Q "SELECT count(*) FROM \"$tabela\"" >/dev/null || { echo "::error::finance_app sem SELECT em $tabela"; exit 1; }
          done
          if Q "CREATE TABLE ddl_proibido (id int)" 2>/dev/null; then
            echo "::error::finance_app conseguiu DDL"; exit 1
          fi
          echo "runtime: SELECT em todas as tabelas, DDL negado"
      - name: reexecutar aplica zero e passa
        env:
          PGPASSWORD: ci_deploy
        run: |
          node dist/database/migration-runner.js
          aplicadas=$(psql -h localhost -U postgres -d finance_deploy -At \
            -c "SELECT count(*) FROM migrations")
          arquivos=$(ls dist/database/migrations/*.js | wc -l)
          test "$aplicadas" = "$arquivos" || { echo "a segunda passada mexeu na contagem"; exit 1; }

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: [quality-validation, security] # só empacota código validado
    permissions:
      contents: read
      security-events: write # upload SARIF para a aba Security
    steps:
      - uses: actions/checkout@v5

      - name: Build da imagem (sem push — artefato morre com o runner)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true # disponibiliza no daemon local p/ scan e smoke
          tags: api-finance:ci

      # ── Scan da imagem em 3 camadas — runbook de triagem no README §Segurança ──
      # O scan cobre a IMAGEM inteira (SO base + camadas + app/node_modules):
      # complementa o npm audit, que cobre só o lockfile do app.

      # 1) VISIBILIDADE: o relatório completo aparece na página do run
      #    (Job Summary) — ninguém precisa escavar log para ver o que gritou.
      - name: Scan — relatório para o Job Summary
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          format: table
          output: trivy-report.txt
          exit-code: '0' # esta camada só reporta; quem bloqueia é o gate
      - name: Publica o relatório no Job Summary
        if: always()
        run: |
          {
            echo '## 🔍 Trivy — scan da imagem api-finance:ci'
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2) GRITO INSTITUCIONAL: cada CVE vira alerta rastreável na aba Security
      #    (histórico, atribuição, dismissal auditável) — o canal do time de
      #    segurança. ESTE REPOSITÓRIO É PRIVADO: a aba Security exige GitHub
      #    Advanced Security. O canal é OPT-IN pela variável de repositório
      #    TRIVY_SARIF_UPLOAD=true (Settings → Secrets and variables → Actions
      #    → Variables) — ligue-a QUANDO o GHAS estiver habilitado. Sem a
      #    variável os steps ficam "skipped" (limpo), em vez de falhar sempre
      #    e ensinar o time a ignorar avisos. O gate abaixo bloqueia sempre,
      #    com ou sem este canal.
      - name: Scan — SARIF
        if: vars.TRIVY_SARIF_UPLOAD == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
      - name: Upload SARIF para a aba Security
        if: vars.TRIVY_SARIF_UPLOAD == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # 3) GATE: HIGH/CRITICAL derruba o job. Exceção SÓ via .trivyignore —
      #    aceite de risco formal com dono, justificativa, expiração e aprovação
      #    do time de segurança (o contrato está no cabeçalho do arquivo).
      - name: Scan — gate HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: api-finance:ci
          severity: HIGH,CRITICAL
          # Explícito (é o default do Trivy): bloqueia MESMO CVE sem correção
          # disponível — o alívio p/ inexploráveis é só o .trivyignore (dono,
          # justificativa, expiração), nunca ignorar por não ter fix.
          ignore-unfixed: 'false'
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Smoke — a imagem sobe contra dependências reais
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile full up -d
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3005/health/readiness; then exit 0; fi
            sleep 2
          done
          echo '--- readiness nunca respondeu; logs da api: ---'
          docker compose --profile full logs api
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile full down -v

  helm-validate:
    name: helm-validate
    runs-on: ubuntu-latest # independente: valida o chart, não a aplicação
    steps:
      - uses: actions/checkout@v5
      # CIDR fictício exercita a regra de saída para o Postgres, que só renderiza com
      # cidrs preenchidos. JWT_AUDIENCE do finance já vem no chart (`finance`).
      - name: Lint do chart
        run: helm lint deploy/helm/api-finance
      # Matriz: default + os values de ambiente. Só com values-{dev,prod} as
      # NetworkPolicies são renderizadas — sem a matriz nunca passariam pelo gate.
      - name: Renderiza os manifests (default, dev, prod)
        run: |
          set -euo pipefail
          C=deploy/helm/api-finance
          PG=(--set 'networkPolicy.egress.postgres.cidrs={10.0.0.0/24}')
          helm template api-finance "$C" "${PG[@]}" > rendered-default.yaml
          helm template api-finance "$C" -f "$C/values-dev.yaml" "${PG[@]}" > rendered-dev.yaml
          helm template api-finance "$C" -f "$C/values-prod.yaml" "${PG[@]}" > rendered-prod.yaml
          # Blocos opcionais ligados (redis, podIdentity, extra = ClickHouse fictício).
          helm template api-finance "$C" -f "$C/values-dev.yaml" "${PG[@]}" \
            --set 'networkPolicy.egress.redis.cidrs={10.0.1.0/24}' \
            --set networkPolicy.egress.podIdentity.enabled=true \
            --set 'networkPolicy.egress.extra[0].to[0].ipBlock.cidr=10.20.0.0/24' \
            --set 'networkPolicy.egress.extra[0].ports[0].port=8443' > rendered-egress-full.yaml
          for f in rendered-dev.yaml rendered-prod.yaml; do
            # app + jobs (migrations) + cronjobs (Trio/ClickHouse)
            [ "$(grep -c '^kind: NetworkPolicy' "$f")" = 3 ] || { echo "::error::$f sem as 3 NetworkPolicies"; exit 1; }
            grep -q '^kind: PodDisruptionBudget' "$f" || { echo "::error::$f sem PodDisruptionBudget"; exit 1; }
            grep -q 'JWT_AUDIENCE: "finance"' "$f" || { echo "::error::$f com JWT_AUDIENCE diferente de finance"; exit 1; }
            [ "$(grep -c 'app.kubernetes.io/component: cronjob' "$f")" -ge 3 ] || { echo "::error::$f: CronJobs fora da policy de saída deles"; exit 1; }
          done
      # Fail-closed provado: sem o audience do módulo o chart NÃO pode renderizar.
      - name: Sem JWT_AUDIENCE o chart é recusado
        run: |
          if helm template api-finance deploy/helm/api-finance --set config.JWT_AUDIENCE= >/dev/null 2>&1; then
            echo "::error::o chart renderizou sem config.JWT_AUDIENCE"; exit 1
          fi
      - name: Valida manifests contra o schema do K8s
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -summary rendered-default.yaml rendered-dev.yaml rendered-prod.yaml rendered-egress-full.yaml
