# Dependabot — vigilância PROATIVA de dependências (roda na INFRA do GitHub,
# não no CI deste repo nem localmente). Abre PRs de atualização; o CI deste
# repositório (os 5 jobs) valida cada PR como qualquer outro.
#
# Security updates (bump quando sai um advisory) já vêm ligados por padrão nas
# Settings do repo. Este arquivo governa os VERSION updates SEMANAIS (segunda-feira).
#
# Princípio anti-ruído (ver README §CI/CD): o Dependabot separa cada dependência
# em um PR. Para pacotes que SÓ funcionam se subirem juntos (o eslint e seu
# ecossistema; o jest e o ts-jest), um PR por pacote quebra o peer e nunca é
# mergeável. Por isso agrupamos toolchains coesos — o PR do grupo sobe o
# conjunto e passa no CI. Majors que DEVEM trilhar o runtime (@types/node segue
# o Node; typescript 7 ainda sem suporte do typescript-eslint) são ignorados
# aqui para não reabrir todo ciclo.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      # Prefixos distintos por natureza da dependência (Conventional Commits):
      #   build(deps)     → dependência de PRODUÇÃO (afeta o artefato/runtime)
      #   chore(deps-dev) → devDependency (manutenção, não vai para a imagem)
      prefix: 'build'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # @types/node acompanha a MAJOR do Node em uso (engines: >=22 <23). Types
      # de uma major além do runtime descrevem APIs inexistentes — compila e
      # quebra em produção. Minor/patch dentro do 22.x seguem fluindo.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 (reescrita nativa) ainda NÃO é suportado pelo ecossistema:
      # typescript-eslint declara peer `typescript <6.1.0`. Reavaliar quando o
      # typescript-eslint publicar suporte ao TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # MAJOR do NestJS é upgrade de FRAMEWORK, não de dependência: o ecossistema
      # @nestjs/* é acoplado por peer deps e versionado como conjunto (no Nest 12
      # até o config, antes em 4.x, saltou para 12.x). Um PR por pacote quebra os
      # peers e NUNCA é mergeável isoladamente — a onda de 10 PRs individuais
      # (11→12, #26–#35) provou ao vivo: npm ci morre em ERESOLVE em segundos.
      # O upgrade de major é decisão humana: branch dedicada (chore/nestjs-N),
      # bump SIMULTÂNEO de todos os @nestjs/* + migration guide oficial + suíte
      # e2e completa. Minor/patch seguem fluindo agrupados (grupo `nestjs`).
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
    groups:
      # ── Toolchains coesos: pacotes que precisam subir JUNTOS ────────────────
      # (grupos SEM update-types capturam major+minor+patch). Um dependency cai
      # no PRIMEIRO grupo cuja lista casa — por isso os específicos vêm antes do
      # catch-all minor-and-patch.
      # O framework sobe JUNTO ou não sobe: minors/patches do ecossistema Nest
      # num único PR coordenado (majors estão em `ignore` acima — decisão humana).
      nestjs:
        patterns:
          - '@nestjs/*'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
          - 'globals'
      jest:
        patterns:
          - 'jest'
          - '@types/jest'
          - 'ts-jest'
      commitlint:
        patterns:
          - '@commitlint/*'
      # ── Todo o resto: minor/patch num PR só; majors avulsos ficam individuais
      #    (major de lib única merece revisão dedicada). ────────────────────────
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
