# ==============================================================================
# Ambiente local — 100% offline, custo zero.
#
# Uso do dia a dia (infra no Docker, app com hot-reload no host):
#   docker compose up -d
#   npm run migration:run && npm run start:dev
#
# Tudo containerizado (inclui a API):
#   docker compose --profile full up --build
#
# Espelho do serviço gerenciado:
#   postgres → RDS Aurora PostgreSQL
# ==============================================================================
name: api-finance
services:
  postgres:
    image: postgres:16-alpine
    container_name: api-finance-postgres
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users
      POSTGRES_DB: users
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U users -d users']
      interval: 5s
      timeout: 3s
      retries: 10

  # Observabilidade local OPT-IN (não pesa o `up` padrão):
  #   docker compose --profile observability up -d
  #   e defina OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 no .env.
  # Um único container com a stack completa: recebe OTLP e mostra traces
  # (Tempo), métricas (Prometheus) e logs (Loki) num Grafana local.
  otel-lgtm:
    profiles: ['observability']
    image: grafana/otel-lgtm:0.30.1
    container_name: users-otel-lgtm
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP (o que o SDK usa)
      - '3300:3000' # Grafana UI (host 3300; a API usa 3005)

  # Ferramenta de ADMINISTRAÇÃO OPT-IN (não pesa o `up` padrão e NÃO espelha
  # produção — é conveniência do dev; por isso fica fora do requirements.yaml):
  #   docker compose --profile tools up -d
  # Conecta no Postgres pela REDE INTERNA do compose (host `postgres`), então
  # independe do docker-compose.override.yml que remapeia a porta PUBLICADA
  # nesta máquina.
  pgadmin:
    profiles: ['tools']
    image: dpage/pgadmin4:8
    container_name: users-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      # Modo dev: sem tela de login/master-password — abre direto
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80' # http://localhost:5050
    volumes:
      # Pré-cadastra o servidor "users (local)" — o dev só digita a senha (users)
      - ./scripts/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['full']
    build: .
    container_name: api-finance
    env_file: .env.docker
    ports:
      - '3005:3005'
    volumes:
      # Chave PÚBLICA de DEV montada em runtime — nunca na imagem (keys/ está no
      # .dockerignore). Espelha o padrão de produção (Secret+volume). Requer
      # `npm run auth:keys` no host antes de `--profile full up`; sem ela, a app
      # sobe fail-closed (rotas protegidas → 401, readiness segue 200).
      - ./keys:/etc/sayplus/jwt:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
